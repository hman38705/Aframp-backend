global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: "${APP_ENV:-development}"
    service: "aframp-backend"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Load alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # Aframp backend application metrics
  - job_name: "aframp_backend"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s

  # Nginx edge proxy — connection/throughput metrics via nginx-prometheus-exporter,
  # scraping the stub_status endpoint exposed at /nginx_status.
  # Rate-limit rejection counts (nginx_rate_limit_rejections_total) arrive
  # separately via the Vector log_to_metric pipeline. See docs/RATE_LIMITING.md.
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    scrape_interval: 15s
